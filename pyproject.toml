[project]
name = "evalpower"
version = "0.0.1"
description = "Analysis code for \"Prefix Caching Can Silently Break Reproducibility in Interactive Agent Evaluation\""
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
analysis = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.13", "statsmodels>=0.14", "matplotlib>=3.8"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalpower"]

[tool.ruff]
line-length = 100
